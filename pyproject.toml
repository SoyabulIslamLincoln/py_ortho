[build-system]
requires = ["setuptools>=61", "wheel", "cython>=3.0", "numpy>=1.21"]
build-backend = "setuptools.build_meta"

[project]
authors = [{ name = "Soyabul Islam Lincoln", email = "islamsoyabul98@gmail.com" }]
license = "MIT"
name = "pyOrthomosaic"
version = "0.6.2"
description = "Native (Cython + optional CUDA) orthomosaic generator for nadir drone imagery"
readme = "README.md"
requires-python = ">=3.9"
keywords = ["orthomosaic", "drone", "photogrammetry", "gis", "geotiff", "cuda", "cython"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Cython",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = ["numpy>=1.21", "pillow>=9.0"]

[project.optional-dependencies]
cuda = ["cupy-cuda12x[ctk]"]   # [ctk] = CUDA headers needed for runtime kernel compilation
mps = ["mlx>=0.25; sys_platform == 'darwin' and platform_machine == 'arm64'"]   # Apple-silicon GPU
mesh = ["open3d>=0.18"]          # Poisson mesh from the dense cloud (macOS: also `brew install libusb`)
laz = ["laspy[lazrs]>=2.4"]      # LAZ-compressed dense point cloud

[project.scripts]
orthomosaic = "orthomosaic.__main__:main"
orthomosaic-3d = "orthomosaic.reconstruct:main"

[tool.setuptools]
packages = ["orthomosaic"]

[tool.cibuildwheel]
build = "cp39-* cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_i686 *-win32 *-manylinux_i686"
test-command = "python {project}/tests/test_core.py && python {project}/tests/test_ba.py && python {project}/tests/test_3d.py && python {project}/tests/test_thermal.py && python {project}/tests/test_terrain.py && python {project}/tests/test_gcp.py && python {project}/tests/test_binding.py && python {project}/tests/test_color.py && python {project}/tests/test_backends.py"
# numpy/pillow only ship recent-Linux (glibc >= 2.28) wheels now; build and test in the
# matching image, and never let pip fall back to compiling a dependency from source.
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
environment = { PIP_PREFER_BINARY = "1" }

[tool.cibuildwheel.macos]
# macOS 14 (Sonoma) and newer only, on both Apple Silicon and Intel
environment = { PIP_PREFER_BINARY = "1", MACOSX_DEPLOYMENT_TARGET = "14.0" }
